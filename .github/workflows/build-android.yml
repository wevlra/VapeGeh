name: Build Android APK

on:
    push:
        branches: [main, master, feat/capacitorjs]
    pull_request:
        branches: [main, master, feat/capacitorjs]

jobs:
    build:
        name: Build Android APK
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies (Mobile)
              working-directory: mobile
              run: npm install --legacy-peer-deps

            - name: Sync Capacitor Android
              working-directory: mobile
              run: npx cap sync android

            - name: Cache Gradle packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/**/*.gradle*', 'mobile/android/**/gradle-wrapper.properties') }}
                  restore-keys: gradle-${{ runner.os }}-

            - name: Make gradlew executable
              working-directory: mobile/android
              run: chmod +x gradlew

            - name: Build debug APK
              working-directory: mobile/android
              run: ./gradlew assembleDebug --no-daemon

            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: app-debug-${{ github.sha }}
                  path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
                  retention-days: 30
